<div class="container">
    <h2>Anime Control Panel</h2>
    
    <div class="card">
        <h3>Step 1: Scrape & Save to Backend</h3>
        <input type="text" id="animeUrl" placeholder="Paste Site URL (TPX/HiAnime)">
        <input type="text" id="animeName" placeholder="Anime Name (e.g. Solo Leveling)">
        <button onclick="startExtraction()">Start Extraction</button>
    </div>

    <div class="card">
        <h3>Step 2: Review Drafts & Upload to Frontend</h3>
        <div id="draftList">
            <p>Loading drafts...</p>
        </div>
    </div>
</div>

<script>
    // Button 1 logic
    async function startExtraction() {
        const url = document.getElementById('animeUrl').value;
        const name = document.getElementById('animeName').value;
        const res = await fetch('/api/admin/extract', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ url, animeName: name })
        });
        const data = await res.json();
        alert(data.message);
        loadDrafts(); // Refresh list
    }

    // Load Drafts for Review
    async function loadDrafts() {
        const res = await fetch('/api/admin/drafts');
        const drafts = await res.json();
        const container = document.getElementById('draftList');
        container.innerHTML = drafts.map(d => `
            <div style="border-bottom:1px solid #ccc; padding:10px; display:flex; justify-content:space-between; align-items:center;">
                <span><strong>${d.title}</strong></span>
                <button onclick="makeLive('${d._id}')" style="background:green;">Upload to Frontend</button>
            </div>
        `).join('') || "No drafts found.";
    }

    // Button 2 logic
    async function makeLive(id) {
        const res = await fetch('/api/admin/publish/' + id, { method: 'POST' });
        const data = await res.json();
        if(data.success) {
            alert("Success! Anime is now LIVE.");
            loadDrafts();
        }
    }

    loadDrafts(); // Initial load
</script>

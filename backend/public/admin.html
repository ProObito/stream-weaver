<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Admin Control</title>
    <style>
        :root {
            --bg: #0b0e14;
            --card: #151921;
            --accent: #00d2ff;
            --success: #00ff88;
            --text: #ffffff;
            --secondary: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }

        .container { max-width: 600px; margin: 0 auto; }

        header { border-bottom: 2px solid #1e293b; padding-bottom: 15px; margin-bottom: 20px; }
        
        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #2d3748;
        }

        .stat-card h2 { font-size: 2.5rem; margin: 0; color: var(--accent); }
        .stat-card p { margin: 5px 0 0; color: var(--secondary); font-size: 0.9rem; }

        /* Control Form */
        .admin-form {
            background: var(--card);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #2d3748;
            margin-bottom: 20px;
        }

        .admin-form h3 { margin-top: 0; color: var(--accent); font-size: 1rem; }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-extract { background: var(--accent); color: #000; }
        .btn-sync { background: var(--success); color: #000; }
        #crawlBtn {
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            color: white;
            padding: 18px;
            width: 100%;
            margin-top: 10px;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Recent Activity */
        .activity-log { background: var(--card); border-radius: 15px; padding: 15px; margin-top: 20px; }
        .log-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--secondary); border-bottom: 1px solid #2d3748; padding-bottom: 10px; }
        .log-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #1e293b; }
        .status-tag { font-size: 0.7rem; color: #94a3b8; border-left: 2px solid var(--accent); padding-left: 8px; }
        .badge { font-size: 0.7rem; padding: 3px 8px; border-radius: 5px; font-weight: bold; background: rgba(0, 255, 136, 0.2); color: #00ff88; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 style="margin:0; font-size: 1.5rem;">Admin Panel</h1>
            <p style="color:var(--secondary); margin:5px 0;">Stream Weaver Control Center</p>
        </header>

        <div class="stats-row">
            <div class="stat-card">
                <h2 id="totalCount">0</h2>
                <p>Total Series</p>
            </div>
            <div class="stat-card">
                <h2 id="lastHour">0</h2>
                <p>Latest Added</p>
            </div>
        </div>

        <div class="admin-form">
            <h3>🎯 Manual Series Control</h3>
            <input type="text" id="manualUrl" placeholder="Paste Anime Link (e.g. HindiSubAnime)">
            <input type="text" id="manualName" placeholder="Anime Name (For DB & Search)">
            <select id="manualLang">
                <option value="Hindi Sub">Hindi Sub</option>
                <option value="Hindi Dub">Hindi Dub</option>
            </select>
            <div class="btn-group">
                <button class="btn-extract" id="extractBtn" onclick="triggerManualCrawl()">EXTRACT LINK</button>
                <button class="btn-sync" onclick="syncToFrontend()">ADD INFO + IMAGE</button>
            </div>
            <p id="statusMsg" style="font-size: 0.8rem; margin-top: 10px; color: var(--secondary); text-align: center;">System Ready</p>
        </div>

        <button id="crawlBtn" onclick="triggerCrawl()">🚀 RUN FULL AUTO-SCAN</button>

        <div class="activity-log">
            <div class="log-header">
                <span>Recent Series</span>
                <span>Language</span>
            </div>
            <div id="logList"></div>
        </div>
    </div>

    <script>
        const API = window.location.origin + '/api/admin';

        async function updateDashboard() {
            try {
                const res = await fetch(`${API}/summary`);
                const data = await res.json();
                document.getElementById('totalCount').innerText = data.total;
                
                const logList = document.getElementById('logList');
                if (data.recentlyAdded.length > 0) {
                    logList.innerHTML = data.recentlyAdded.map(item => `
                        <div class="log-item">
                            <div class="log-info">
                                <h4 style="margin:0; font-size:0.9rem;">${item.title}</h4>
                                <div class="status-tag">Ready to Stream</div>
                            </div>
                            <span class="badge">${item.language || 'Sub'}</span>
                        </div>
                    `).join('');
                }
            } catch (err) { console.error(err); }
        }

        async function triggerManualCrawl() {
            const url = document.getElementById('manualUrl').value;
            const animeName = document.getElementById('manualName').value;
            const language = document.getElementById('manualLang').value;
            const btn = document.getElementById('extractBtn');
            const msg = document.getElementById('statusMsg');

            if(!url || !animeName) return alert("Pehle URL aur Name dalo!");

            btn.disabled = true;
            msg.innerText = "Extracting & Uploading... Check Logs.";
            
            try {
                const res = await fetch(`${API}/manual-extract`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, animeName, language })
                });
                const data = await res.json();
                alert(data.message);
            } catch (err) { alert("Backend Error!"); }
            finally { btn.disabled = false; btn.innerText = "EXTRACT LINK"; }
        }

        function syncToFrontend() {
            const name = document.getElementById('manualName').value;
            if(!name) return alert("Anime Name dalo taaki MAL se info nikal saku!");
            alert("Auto-Syncing Cover Image and Description for: " + name);
            // Backend handle kar raha hai extraction ke waqt hi
        }

        async function triggerCrawl() {
            const btn = document.getElementById('crawlBtn');
            btn.disabled = true;
            btn.innerText = "⚡ RUNNING SCAN...";
            try {
                await fetch(`${API}/start-mega-crawl`, { method: 'POST' });
                setTimeout(() => { 
                    btn.disabled = false; 
                    btn.innerText = "🚀 RUN FULL AUTO-SCAN"; 
                }, 5000);
            } catch (err) { btn.disabled = false; }
        }

        setInterval(updateDashboard, 5000);
        updateDashboard();
    </script>
</body>
</html>
